<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dockerized Nginx Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            font-size: 18px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            color: #0d6efd;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .badge {
            background: #212529;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #212529;
            color: white;
            margin-top: 40px;
        }

    </style>
</head>

<body>

<header>
    <h1>🚀 Dockerized Web Server</h1>
    <p>Deployed using Docker and NGINX Container</p>
</header>


<div class="container">

    <div class="card">

        <h2>Hello, LinkedIn! 👋</h2>

        <p>
            This website is hosted inside a Docker container
            using the NGINX web server.
        </p>

        <p>
            Built as part of my DevOps Internship Task.
        </p>


        <h2>Technologies Used</h2>

        <div class="skills">
            <div class="badge">Docker</div>
            <div class="badge">NGINX</div>
            <div class="badge">HTML</div>
            <div class="badge">Linux</div>
        </div>

    </div>

</div>


<footer>
    Created by Janvi | Docker Web Server Project
</footer>


</body>
</html>
